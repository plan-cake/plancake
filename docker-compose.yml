services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    command: uvicorn api.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - LIVE_UPDATES_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    env_file:
      - ./frontend/.env
    environment:
      # The API URL for both the client and the Next.js server to communicate with the backend
      - INTERNAL_API_URL=http://backend:8000
      # For Next.js to detect file changes in Docker
      - WATCHPACK_POLLING=true
    command: ["sh", "./start.sh"]
    depends_on:
      - backend

volumes:
  redis_data:
  node_modules:
  next_cache:
