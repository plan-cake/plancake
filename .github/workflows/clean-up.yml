name: Weekly Image Cleanup

on:
  schedule:
    - cron: "0 0 * * 0" # run every sunday at midnight
  workflow_dispatch:

jobs:
  clean-registry:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Clean up Plancake Frontend images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: plancake-frontend
          cut-off: 1w
          timestamp-to-use: updated_at
          keep-n-most-recent: 3
          dry-run: false

      - name: Clean up Plancake Backend images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: plancake-backend
          cut-off: 1w
          timestamp-to-use: updated_at
          keep-n-most-recent: 3
          dry-run: false
