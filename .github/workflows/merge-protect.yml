name: "Merge Protect"
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    # Having edited here updates the check when changing the base branch
    types: [synchronize, opened, reopened, edited]

env:
  HEAD_REF: ${{ github.head_ref }}

jobs:
  check_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check branch
        if: github.base_ref == 'main'
        run: |
          if [[ ! "$HEAD_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: You can only merge to main from version branches (e.g. v1.2.3)."
            exit 1
          fi

      - name: Check package version
        if: github.base_ref == 'main'
        run: |
          # Extract the version from package.json
          PACKAGE_VERSION=$(jq -r '.version' frontend/package.json)

          # Extract the version from the branch name
          BRANCH_VERSION="${HEAD_REF#v}"

          if [[ "$PACKAGE_VERSION" != "$BRANCH_VERSION" ]]; then
            echo "Error: The version in package.json ($PACKAGE_VERSION) does not match the version in the branch name ($BRANCH_VERSION)."
            exit 1
          fi
